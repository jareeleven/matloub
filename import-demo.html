const log = (msg, cls='info') => {
  const div = document.getElementById('log');
  div.innerHTML += `<div class="${cls}">${msg}</div>`;
  div.scrollTop = div.scrollHeight;
};

window.startImport = async () => {
  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = '⏳ Import en cours...';
  document.getElementById('log').innerHTML = '';

  try {
    log('🔥 Connexion à Firebase...');
    const app = initializeApp(FIREBASE_CONFIG);
    const db  = getFirestore(app);
    const auth = getAuth(app);
    await signInAnonymously(auth);
    log('✅ Connecté à Firebase !', 'ok');

    let success = 0;
    for (const pro of DEMO_PROS) {
      try {
        await setDoc(doc(db, 'professionals', String(pro.id)), pro);
        log(`✅ ${pro.name} (${pro.job}) importé`, 'ok');
        success++;
        await new Promise(r => setTimeout(r, 300));
      } catch(e) {
        log(`❌ Erreur pour ${pro.name}: ${e.message}`, 'err');
      }
    }

    log(`<br><strong>🎉 Import terminé ! ${success}/14 pros importés dans Firestore.</strong>`, 'ok');
    log(`<br>⚠️ Supprimez ce fichier (import-demo.html) de GitHub maintenant !`, 'err');
    btn.textContent = '✅ Import terminé !';
  } catch(e) {
    log(`❌ Erreur Firebase: ${e.message}`, 'err');
    btn.disabled = false;
    btn.textContent = '🚀 Réessayer';
  }
};
